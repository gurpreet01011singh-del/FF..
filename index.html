<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Custom Tournament</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;500;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #050508;
            color: #ffffff;
            margin: 0;
            padding: 20px 10px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(220, 20, 60, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 20% 90%, rgba(10, 10, 20, 0.9) 0%, #050508 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .container {
            max-width: 460px;
            margin: 0 auto;
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 59, 59, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 59, 59, 0.05);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #ff3b3b;
            font-size: 24px;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255, 59, 59, 0.5);
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: #ff5252;
            margin-bottom: 12px;
            text-align: left;
            border-left: 3px solid #ff3b3b;
            padding-left: 8px;
            letter-spacing: 0.5px;
        }

        .plans-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .plan-card {
            background: linear-gradient(135deg, rgba(28, 28, 40, 0.9) 0%, rgba(18, 18, 26, 0.9) 100%);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .plan-info h3 {
            margin: 0;
            font-size: 14px;
            color: #fff;
            font-weight: 600;
        }

        .plan-info p {
            margin: 2px 0 0;
            font-size: 12px;
            color: #00e676;
            font-weight: 600;
        }

        .plan-time {
            font-size: 11px;
            color: #ffb74d;
            margin-top: 2px;
        }

        .slot-count {
            font-size: 10px;
            color: #ff3b3b;
            margin-top: 2px;
            font-weight: bold;
        }

        .join-btn {
            background: linear-gradient(135deg, #ff3b3b 0%, #c62828 100%);
            color: #fff;
            border: none;
            padding: 7px 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 10px rgba(255, 59, 59, 0.3);
        }

        .join-btn:active {
            transform: scale(0.95);
        }

        .scanner-section {
            background: rgba(12, 12, 18, 0.9);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .scanner-section img {
            width: 170px;
            height: auto;
            background: #fff;
            padding: 6px;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0d0d14;
            color: #fff;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #ff3b3b;
            box-shadow: 0 0 8px rgba(255, 59, 59, 0.25);
        }

        .submit-btn {
            background: linear-gradient(135deg, #00e676 0%, #00c853 100%);
            color: #050508;
            border: none;
            padding: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FREE FIRE WARS</h1>
        <div class="subtitle">Elite Custom Tournament</div>

        <div class="section-title">Select Tournament Slot (Max 50/Day)</div>
        <div class="plans-grid" id="plansGrid">
            <!-- Dynamic Plans -->
        </div>

        <div class="section-title">Scan & Pay</div>
        <div class="scanner-section">
            <div style="font-size: 11px; color:#94a3b8; text-transform:uppercase;">QR Code par payment karke UTR note karo</div>
            <img src="scanner.jpg" alt="QR Scanner">
            
        </div>

        <div class="section-title">Player Details</div>
        <form id="tourneyForm">
            <!-- FormSubmit Extra Settings -->
            <input type="hidden" name="_subject" value="New Free Fire Tournament Registration!">
            <input type="hidden" name="_captcha" value="false">

            <div>
                <label>Selected Slot:</label>
                <input type="text" id="selectedPlan" name="Selected_Plan" value="Plan 1 (Entry ₹10 - 05:00 PM)" readonly>
            </div>
            <div>
                <label>Your Name:</label>
                <input type="text" name="Player_Name" placeholder="Enter your name" required>
            </div>
            <div>
                <label>Free Fire Username:</label>
                <input type="text" name="FF_Username" placeholder="In-game name" required>
            </div>
            <div>
                <label>Free Fire UID:</label>
                <input type="text" name="FF_UID" value="5416367393" required>
            </div>
            <div>
                <label>Transaction ID / UTR:</label>
                <input type="text" name="UTR_Number" placeholder="Enter payment UTR number" required>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Submit Details</button>
        </form>
    </div>

    <script>
        const plans = [
            { id: 'plan1', name: 'Plan 1 (Entry ₹10 - 05:00 PM)', price: '₹10', win: '₹300', time: '05:00 PM' },
            { id: 'plan2', name: 'Plan 2 (Entry ₹20 - 06:00 PM)', price: '₹20', win: '₹600', time: '06:00 PM' },
            { id: 'plan3', name: 'Plan 3 (Entry ₹30 - 07:00 PM)', price: '₹30', win: '₹1000', time: '07:00 PM' },
            { id: 'plan4', name: 'Plan 4 (Entry ₹40 - 08:00 PM)', price: '₹40', win: '₹1500', time: '08:00 PM' },
            { id: 'plan5', name: 'Plan 5 (Entry ₹50 - 09:00 PM)', price: '₹50', win: '₹1800', time: '09:00 PM' }
        ];

        function getTodayKey() {
            return new Date().toISOString().slice(0, 10);
        }

        function getCounts() {
            const today = getTodayKey();
            let data = JSON.parse(localStorage.getItem('ff_slots') || '{}');
            if (data.date !== today) {
                data = { date: today, counts: {} };
                localStorage.setItem('ff_slots', JSON.stringify(data));
            }
            return data;
        }

        function renderPlans() {
            const grid = document.getElementById('plansGrid');
            const data = getCounts();
            grid.innerHTML = '';

            plans.forEach(p => {
                const count = data.counts[p.id] || 0;
                const remaining = 50 - count;
                const isFull = count >= 50;

                grid.innerHTML += `
                    <div class="plan-card">
                        <div class="plan-info">
                            <h3>Plan: Entry ${p.price}</h3>
                            <p>Win: ${p.win}</p>
                            <div class="plan-time">⏰ ${p.time}</div>
                            <div class="slot-count">${isFull ? 'HOUSEFULL (0/50)' : `Spots Left: ${remaining}/50`}</div>
                        </div>
                        <button class="join-btn" ${isFull ? 'disabled style="background:#444; cursor:not-allowed;"' : `onclick="selectPlan('${p.name}', '${p.id}')"`}>${isFull ? 'FULL' : 'SELECT'}</button>
                    </div>
                `;
            });
        }

        let selectedPlanId = 'plan1';
        function selectPlan(planName, planId) {
            document.getElementById('selectedPlan').value = planName;
            selectedPlanId = planId;
            document.getElementById('tourneyForm').scrollIntoView({ behavior: 'smooth' });
        }

        renderPlans();

        document.getElementById('tourneyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let data = getCounts();
            let currentCount = data.counts[selectedPlanId] || 0;
            if (currentCount >= 50) {
                alert("Is slot de saare 50 spots bhar chuke hain!");
                renderPlans();
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "SUBMITTING...";
            btn.disabled = true;

            const formData = new FormData(this);

            fetch("https://formsubmit.co/ajax/Gurpreet01011singh@gmail.com", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(resData => {
                data.counts[selectedPlanId] = (data.counts[selectedPlanId] || 0) + 1;
                localStorage.setItem('ff_slots', JSON.stringify(data));
                renderPlans();

                alert("Details successfully submit ho gayi hain! Admin verify karke room ID bhej dega.");
                document.getElementById('tourneyForm').reset();
                document.getElementById('selectedPlan').value = "Plan 1 (Entry ₹10 - 05:00 PM)";
                selectedPlanId = 'plan1';
                document.querySelector('input[name="FF_UID"]').value = "5416367393";
                btn.innerText = "Submit Details";
                btn.disabled = false;
            })
            .catch(err => {
                alert("Kuch error aa gaya, dobara try karo!");
                btn.innerText = "Submit Details";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
